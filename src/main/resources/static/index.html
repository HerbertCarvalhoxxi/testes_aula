<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Reserva E2E</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        .form-group { margin-bottom: 15px; }
        .sucesso { color: green; font-weight: bold; }
        .erro { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Cadastro na Viagem</h2>
    <div>
        <div class="form-group">
            <label>Nome:</label>
            <input type="text" id="nomeInput" placeholder="Seu nome">
        </div>
        <div class="form-group">
            <label>Idade:</label>
            <input type="number" id="idadeInput" placeholder="Sua idade">
        </div>
        <button id="btnReservar" onclick="fazerReserva()">Reservar Vaga</button>
    </div>
    <p id="mensagemRetorno"></p>

    <script>
        async function fazerReserva() {
            const nome = document.getElementById('nomeInput').value;
            const idade = document.getElementById('idadeInput').value;
            const msg = document.getElementById('mensagemRetorno');

            try {
                // Tenta adicionar na viagem de ID 1
                const response = await fetch('/api/viagens/1/passageiros', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, idade })
                });
                
                const texto = await response.text();
                // Altera a classe CSS dependendo do Status HTTP (200 OK vs 400 Bad Request)
                msg.className = response.ok ? 'sucesso' : 'erro';
                msg.innerText = texto;
            } catch (error) {
                msg.className = 'erro';
                msg.innerText = "Erro ao conectar com a API.";
            }
        }
    </script>
</body>
</html>
