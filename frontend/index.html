<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce - Teste de Sistema</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen relative">

    <!-- Container de Notificações Toast -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <div class="container mx-auto p-4">

        <!-- 1. TELA DE LOGIN / CADASTRO -->
        <div id="auth-screen" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center text-gray-800">Login no E-commerce</h2>
            
            <div id="register-fields" class="hidden mb-4">
                <label class="block text-gray-700 font-medium">Nome</label>
                <input type="text" id="reg-nome" class="w-full border p-2 rounded mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Seu nome">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-medium">E-mail</label>
                <input type="email" id="email" class="w-full border p-2 rounded mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" value="com_saldo@email.com">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-medium">Senha</label>
                <input type="password" id="senha" class="w-full border p-2 rounded mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500" value="123456">
            </div>

            <!-- Botão Dinâmico -->
            <button id="auth-btn" onclick="executarAcaoAuth()" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700 transition">Entrar</button>
            
            <div id="auth-erro" class="text-red-500 text-sm mt-3 text-center"></div>

            <!-- Alternar entre Login e Cadastro -->
            <div class="mt-4 text-center">
                <button onclick="alternarModoAuth()" id="toggle-mode-btn" class="text-sm text-blue-600 hover:underline">Não tem uma conta? Cadastre-se</button>
            </div>
        </div>

        <!-- 2. TELA DA LOJA / PRODUTOS E CARRINHO -->
        <div id="store-screen" class="hidden">
            <!-- Header do Usuário -->
            <header class="flex justify-between items-center bg-white p-4 rounded-lg shadow mb-6">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Vitrine de Produtos</h1>
                    <p class="text-sm text-gray-600">Usuário: <span id="user-name" class="font-semibold text-blue-600"></span> | Saldo: R$ <span id="user-saldo" class="font-semibold text-green-600"></span></p>
                </div>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition text-sm font-semibold">Sair</button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Lista de Produtos -->
                <div class="md:col-span-2">
                    <h2 class="text-lg font-bold mb-4 text-gray-800">Produtos Disponíveis</h2>
                    <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Os produtos injetados via JavaScript aparecerão aqui -->
                    </div>
                </div>

                <!-- Painel do Carrinho e Finalização -->
                <div class="bg-white p-6 rounded-lg shadow h-fit">
                    <h2 class="text-lg font-bold mb-2 text-gray-800">Resumo da Compra</h2>
                    <p class="text-sm text-gray-600 mb-4">Total de itens: <span id="cart-count" class="font-bold text-blue-600">0</span></p>
                    
                    <!-- Lista detalhada dos itens e quantidades no carrinho -->
                    <div id="cart-items-list" class="mb-4 max-h-48 overflow-y-auto border-t border-b py-2 divide-y text-sm text-gray-700">
                        <p class="text-gray-400 text-center py-2">Carrinho vazio</p>
                    </div>

                    <button onclick="finalizarCompra()" class="w-full bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700 transition shadow">
                        Efetuar Compra
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Script de Integração -->
    <script>
        let usuarioLogado = null;
        let modoCadastro = false;
        const API_URL = 'http://localhost:8080/api';

        function mostrarToast(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const corFundo = tipo === 'sucesso' ? 'bg-green-600' : 'bg-red-600';
            
            toast.className = `${corFundo} text-white px-4 py-3 rounded-lg shadow-lg flex items-center justify-between text-sm font-semibold transition transform translate-y-2 opacity-0 duration-300`;
            toast.innerHTML = `<span>${mensagem}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function alternarModoAuth() {
            modoCadastro = !modoCadastro;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('auth-btn');
            const toggleBtn = document.getElementById('toggle-mode-btn');
            const registerFields = document.getElementById('register-fields');
            document.getElementById('auth-erro').innerText = '';

            if (modoCadastro) {
                title.innerText = 'Criar Nova Conta';
                btn.innerText = 'Cadastrar';
                toggleBtn.innerText = 'Já tem uma conta? Faça login';
                registerFields.classList.remove('hidden');
            } else {
                title.innerText = 'Login no E-commerce';
                btn.innerText = 'Entrar';
                toggleBtn.innerText = 'Não tem uma conta? Cadastre-se';
                registerFields.classList.add('hidden');
            }
        }

        async function executarAcaoAuth() {
            if (modoCadastro) {
                await fazerCadastro();
            } else {
                await fazerLogin();
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erroDiv = document.getElementById('auth-erro');
            erroDiv.innerText = '';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                if (!response.ok) {
                    const erroMsg = await response.text();
                    throw new Error(erroMsg);
                }

                usuarioLogado = await response.json();
                entrarNaLoja();
                mostrarToast(`Bem-vindo de volta, ${usuarioLogado.nome}!`, 'sucesso');
            } catch (error) {
                erroDiv.innerText = error.message;
            }
        }

        async function fazerCadastro() {
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erroDiv = document.getElementById('auth-erro');
            erroDiv.innerText = '';

            if (!nome) {
                erroDiv.innerText = 'O campo nome é obrigatório.';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, saldo: 2000.0 })
                });

                if (!response.ok) {
                    const erroMsg = await response.text();
                    throw new Error(erroMsg);
                }

                usuarioLogado = await response.json();
                entrarNaLoja();
                mostrarToast('Conta criada com sucesso! Saldo inicial: R$ 2000.00', 'sucesso');
            } catch (error) {
                erroDiv.innerText = error.message;
            }
        }

        function entrarNaLoja() {
            atualizarInterfaceUsuario();
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('store-screen').classList.remove('hidden');
            carregarProdutos();
        }

        function atualizarInterfaceUsuario() {
            document.getElementById('user-name').innerText = usuarioLogado.nome;
            document.getElementById('user-saldo').innerText = usuarioLogado.saldo.toFixed(2);
            
            const carrinho = usuarioLogado.carrinho || [];
            let quantidadeTotalItens = carrinho.reduce((total, item) => total + (Number(item.quantidade) || 0), 0);
            document.getElementById('cart-count').innerText = quantidadeTotalItens;
            
            const cartItemsList = document.getElementById('cart-items-list');
            if (carrinho.length === 0) {
                cartItemsList.innerHTML = `<p class="text-gray-400 text-center py-2">Carrinho vazio</p>`;
            } else {
                cartItemsList.innerHTML = '';
                carrinho.forEach(item => {
                    cartItemsList.innerHTML += `
                        <div class="py-2 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-gray-800">${item.produto.nome}</p>
                                <p class="text-xs text-gray-500">Qtd: ${item.quantidade}x R$ ${item.produto.preco.toFixed(2)}</p>
                            </div>
                            <span class="font-semibold text-gray-700">R$ ${(item.produto.preco * item.quantidade).toFixed(2)}</span>
                        </div>
                    `;
                });
            }
        }

        async function carregarProdutos() {
            try {
                const response = await fetch(`${API_URL}/produtos`);
                const produtos = await response.json();
                const listContainer = document.getElementById('product-list');
                listContainer.innerHTML = '';

                produtos.forEach(produto => {
                    listContainer.innerHTML += `
                        <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-between border border-gray-100">
                            <div>
                                <img src="${produto.imagemUrl}" alt="${produto.nome}" class="w-full h-36 object-cover rounded mb-3 bg-gray-200">
                                <h3 class="font-bold text-gray-800 text-lg">${produto.nome}</h3>
                                <p class="text-green-600 font-bold text-base mt-1">R$ ${produto.preco.toFixed(2)}</p>
                                <p class="text-xs text-gray-500 mt-1">Estoque disponível: ${produto.estoque}</p>
                            </div>
                            <button onclick="adicionarCarrinho(${produto.id})" class="mt-4 bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition text-sm font-semibold">
                                Adicionar ao Carrinho
                            </button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Erro ao buscar produtos:', error);
            }
        }

        async function adicionarCarrinho(produtoId) {
            try {
                const response = await fetch(`${API_URL}/carrinho/adicionar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioId: usuarioLogado.id,
                        produtoId: produtoId,
                        quantidade: 1
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.erro || 'Erro ao adicionar item');

                mostrarToast(data.mensagem, 'sucesso');
                await atualizarDadosUsuario();
            } catch (error) {
                mostrarToast(error.message, 'erro');
            }
        }

        async function atualizarDadosUsuario() {
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: usuarioLogado.email, senha: usuarioLogado.senha })
                });
                if (response.ok) {
                    usuarioLogado = await response.json();
                    atualizarInterfaceUsuario();
                }
            } catch (e) {
                console.error("Erro ao atualizar dados do usuário", e);
            }
        }

        async function finalizarCompra() {
            try {
                const response = await fetch(`${API_URL}/carrinho/comprar/${usuarioLogado.id}`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.erro || 'Erro na compra');

                mostrarToast(data.mensagem, 'sucesso');
                await atualizarDadosUsuario();
            } catch (error) {
                mostrarToast(error.message, 'erro');
            }
        }

        function logout() {
            usuarioLogado = null;
            document.getElementById('store-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            mostrarToast('Sessão encerrada.', 'sucesso');
        }
    </script>
</body>
</html>
